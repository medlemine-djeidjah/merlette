spring.application.name=merlette-backend
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/merlette}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:merlette}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:merlette_dev}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB
merlette.cors-origin=${FRONTEND_URL:http://localhost:5173}
merlette.jwt-secret=${JWT_SECRET:}
merlette.upload-directory=${UPLOAD_DIRECTORY:uploads}
