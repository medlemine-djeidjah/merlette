spring.application.name=merlette-backend

# Secrets et réglages lus depuis le fichier .env (non versionné, voir .env.example)
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

# Base de données
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/merlette}
spring.datasource.username=${DATABASE_USER:merlette}
spring.datasource.password=${DATABASE_PASSWORD:merlette}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Upload : 5 Mo par image, 5 images max par requête
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB

# Application
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=24
app.upload-dir=${UPLOAD_DIR:uploads}
# Origines autorisées (motifs séparés par des virgules) : localhost + réseau local par défaut
app.cors-origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://10.*,http://192.168.*,http://172.*}

# Documentation : Swagger UI sur /docs, spécification OpenAPI sur /v3/api-docs
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
