# Base PostgreSQL de développement : docker compose up -d
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: merlette
      POSTGRES_USER: merlette
      POSTGRES_PASSWORD: merlette
    ports:
      - "5432:5432"
    volumes:
      - merlette-db:/var/lib/postgresql/data

volumes:
  merlette-db:
